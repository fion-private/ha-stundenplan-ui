name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # HACS (category "plugin") downloads the release asset matching
      # hacs.json's "filename" field - it must be attached directly to the
      # GitHub Release, not just committed to the repository.
      - name: Attach dist/stundenplan-card.js to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/stundenplan-card.js
          generate_release_notes: true
