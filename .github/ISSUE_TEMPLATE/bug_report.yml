name: Bug report
description: Report a problem with the Stundenplan card
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: input
    id: card-version
    attributes:
      label: Card version
      description: See the console log line starting with "STUNDENPLAN-CARD", or your HACS download list.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant Core version
      placeholder: "2026.8.0"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card YAML configuration
      render: yaml
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Open your browser's developer tools (F12) → Console, and paste any relevant errors here.
      render: text
